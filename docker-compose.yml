# GoPoint: запуск одной командой (scripts/run-demo.sh или docker compose up -d --build).
# Наружу открыт только caddy. Сервер и (позже) OpenTripPlanner живут во внутренней сети.
name: gopoint

services:
  server:
    build: ./server
    image: gopoint-server:local
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks: [internal]

  caddy:
    build: ./web
    image: gopoint-web:local
    environment:
      GOPOINT_SITE_ADDRESS: ${GOPOINT_SITE_ADDRESS:-:80}
    ports:
      - "${GOPOINT_HTTP_PORT:-8080}:80"
      - "${GOPOINT_HTTPS_PORT:-8443}:443"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
