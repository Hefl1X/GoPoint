# GoPoint: запуск одной командой (scripts/run-demo.sh или docker compose up -d --build).
# Наружу открыт только caddy. Сервер, поиск адресов (photon) и (позже) OpenTripPlanner
# живут во внутренней сети.
name: gopoint

services:
  server:
    build: ./server
    image: gopoint-server:local
    env_file:
      - path: .env
        required: false
    environment:
      # Свой поиск адресов по Новосибирску (база: scripts/build-photon-db.sh).
      GOPOINT_PHOTON_URL: ${GOPOINT_PHOTON_URL:-http://photon:2322}
    restart: unless-stopped
    networks: [internal]

  photon:
    build: ./photon
    image: gopoint-photon:local
    environment:
      PHOTON_JAVA_OPTS: ${GOPOINT_PHOTON_JAVA_OPTS:--Xmx1g}
    volumes:
      - photon_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2322/status"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks: [internal]

  otp:
    # OpenTripPlanner 2.10.0 только для пеших участков (граф улиц: scripts/build-otp-graph.sh).
    image: opentripplanner/opentripplanner:2.10.0
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: ${GOPOINT_OTP_JAVA_OPTS:--Xmx2g}
    volumes:
      - ./data/otp:/var/opentripplanner
    restart: unless-stopped
    networks: [internal]

  caddy:
    build: ./web
    image: gopoint-web:local
    environment:
      GOPOINT_SITE_ADDRESS: ${GOPOINT_SITE_ADDRESS:-:80}
    ports:
      - "${GOPOINT_HTTP_PORT:-8080}:80"
      - "${GOPOINT_HTTPS_PORT:-8443}:443"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal: {}

volumes:
  photon_data: {}
  caddy_data: {}
  caddy_config: {}
