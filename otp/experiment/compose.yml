services:
  fixture:
    image: gopoint-server:local
    pull_policy: never
    entrypoint: ["python", "-m", "http.server", "9000", "--directory", "/rt"]
    volumes:
      - "${GOPOINT_OTP_EXPERIMENT_DIR:?Укажите каталог эксперимента}/rt:/rt:ro"
  otp:
    image: opentripplanner/opentripplanner:2.10.0
    pull_policy: never
    command: ["--load"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx3g"
    volumes:
      - "${GOPOINT_OTP_EXPERIMENT_DIR:?Укажите каталог эксперимента}/graph:/var/opentripplanner"
    ports:
      - "127.0.0.1:18800:8080"
    depends_on:
      - fixture
